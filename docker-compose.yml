x-freqtradebot: &default-freqtradebot
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./user_data:/freqtrade/user_data
    - ./configs:/freqtrade/configs
    - ./db:/freqtrade/db

services:
  pingpong_gmx:
    <<: *default-freqtradebot
    container_name: pingpong_gmx
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "9090:8080"
    command: >
      trade
        --strategy Pingpong
        --config /freqtrade/configs/pingpong_gmx.json
        --config /freqtrade/configs/pingpong_gmx.secrets.json
        --db-url sqlite:////freqtrade/db/pingpong_gmx.sqlite
        --logfile /freqtrade/user_data/logs/pingpong_gmx.log

  pingpong_hyperliquid:
    <<: *default-freqtradebot
    container_name: pingpong_hyperliquid
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "9095:8080"  
    command: >
      trade
        --strategy Pingpong
        --config /freqtrade/configs/pingpong_hyperliquid.json
        --config /freqtrade/configs/pingpong_hyperliquid.secrets.json
        --db-url sqlite:////freqtrade/db/pingpong_hyperliquid.sqlite
        --logfile /freqtrade/user_data/logs/pingpong_hyperliquid.log

  simple_gmx:
    <<: *default-freqtradebot
    container_name: simple_gmx
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "9091:8080"
    command: >
      trade
        --strategy Simple
        --config /freqtrade/configs/simple_gmx.json
        --config /freqtrade/configs/simple_gmx.secrets.json
        --db-url sqlite:////freqtrade/db/simple_gmx.sqlite
        --logfile /freqtrade/user_data/logs/simple_gmx.log

  simple_hyperliquid:
    <<: *default-freqtradebot
    container_name: simple_hyperliquid
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "9092:8080"
    command: >
      trade
        --strategy Simple
        --config /freqtrade/configs/simple_hyperliquid.json
        --config /freqtrade/configs/simple_hyperliquid.secrets.json
        --db-url sqlite:////freqtrade/db/simple_hyperliquid.sqlite
        --logfile /freqtrade/user_data/logs/simple_hyperliquid.log

  adxmomentum_gmx:
    <<: *default-freqtradebot
    container_name: adxmomentum_gmx
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "9093:8080"
    command: >
      trade
        --strategy ADXMomentum
        --config /freqtrade/configs/adxmomentum_gmx.json
        --config /freqtrade/configs/adxmomentum_gmx.secrets.json
        --db-url sqlite:////freqtrade/db/adxmomentum_gmx.sqlite
        --logfile /freqtrade/user_data/logs/adxmomentum_gmx.log

  ichiv2_gmx:
    <<: *default-freqtradebot
    container_name: ichiv2_gmx
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "9094:8080"
    command: >
      trade
        --strategy IchiV2_LS_Static
        --config /freqtrade/configs/ichiv2_gmx.json
        --config /freqtrade/configs/ichiv2_gmx.secrets.json
        --db-url sqlite:////freqtrade/db/ichiv2_gmx.sqlite
        --logfile /freqtrade/user_data/logs/ichiv2_gmx.log

  ichiv2_gmx_vault:
    <<: *default-freqtradebot
    container_name: ichiv2_gmx_vault
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "9096:8080"
    command: >
      trade
        --strategy IchiV2_LS_Static_WhaleCap
        --config /freqtrade/configs/ichiv2_gmx_prod_vault.json
        --config /freqtrade/configs/ichiv2_gmx_prod_vault.secrets.json
        --db-url sqlite:////freqtrade/db/ichiv2_gmx_vault.sqlite
        --logfile /freqtrade/user_data/logs/ichiv2_gmx_vault.log

  ichiv2_gmx_oi_filter_backtest:
    <<: *default-freqtradebot
    container_name: ichiv2_gmx_oi_filter_backtest
    build:
      context: .
      dockerfile: ./Dockerfile
    command: >
      backtesting
        --strategy IchiV2_LS_OI_Filter
        --config /freqtrade/configs/ichiv2_gmx_oi_filter_backtest.json
        --config /freqtrade/configs/ichiv2_gmx_oi_filter_backtest.secrets.json
        --strategy-path /freqtrade/strategies
        --datadir /freqtrade/user_data/data/gmx_complete
        --timeframe-detail 5m

  # Generic backtest runner — used by `make backtest`, `make hyperopt`, etc.
  # Does NOT run by default (no command). Starts only when invoked via make targets.
  # Shares data volumes with live bots but runs as a separate container.
  backtest-runner:
    <<: *default-freqtradebot
    container_name: backtest-runner
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: "no"
    profiles:
      - tools
    command: ["echo", "Use via make backtest/hyperopt targets"]

  caddy:
    image: caddy:2.4.5
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
