name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install freqtrade dependencies
        run: |
          source .venv/bin/activate
          pip install -r freqtrade-develop/requirements.txt

      - name: Install freqtrade
        run: |
          source .venv/bin/activate
          pip install -e freqtrade-develop/

      - name: Install GMX CCXT adapter
        run: |
          source .venv/bin/activate
          pip install "web3-ethereum-defi[data,ccxt]"

      - name: Verify installation
        run: ./freqtrade-gmx --version

      - name: Set backtest time range
        id: timerange
        run: |
          # GMX historical data API serves ~6 months of 1h candles.
          # Compute a 5-month window ending yesterday to stay within limits.
          START=$(date -d '5 months ago' +%Y%m%d)
          END=$(date -d 'yesterday' +%Y%m%d)
          echo "range=${START}-${END}" >> "$GITHUB_OUTPUT"
          echo "Backtest time range: ${START}-${END}"

      - name: Download historical data
        run: |
          ./freqtrade-gmx download-data \
            --config configs/adxmomentum_gmx.json \
            --config configs/secrets.empty.json \
            --exchange gmx \
            --timeframe 1h \
            --timerange ${{ steps.timerange.outputs.range }}

      - name: Run backtest
        run: |
          ./freqtrade-gmx backtesting \
            --config configs/adxmomentum_gmx.json \
            --config configs/secrets.empty.json \
            --strategy ADXMomentum \
            --timerange ${{ steps.timerange.outputs.range }}
